name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect active Java version."
            exit 1
          fi

          # Extract major version (handling legacy 1.x and modern formats)
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $MAJOR_VERSION"

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Detected Java major version is not a valid integer: $MAJOR_VERSION"
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version ($MAJOR_VERSION) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Keystore already exists at $KEYSTORE_PATH"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create or verify ./debug.keystore."
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build minimal test APK
        run: gradle :minimal:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at: $EXPECTED_APK"
            echo "Discovered APK files inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file exists but is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac

          echo "APK successfully verified: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"

          MINIMAL_APK="minimal/build/outputs/apk/debug/minimal-debug.apk"
          MINIMAL_ASSET="${TEMP_DIR}/mayuri-test-${GITHUB_RUN_NUMBER}.apk"
          if [ -f "$MINIMAL_APK" ] && [ -s "$MINIMAL_APK" ]; then
            cp "$MINIMAL_APK" "$MINIMAL_ASSET"
            echo "minimal_asset=${MINIMAL_ASSET}" >> "$GITHUB_OUTPUT"
            echo "Test APK prepared: $MINIMAL_ASSET"
          fi
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset ($ASSET_PATH) is missing or empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset ($ASSET_PATH) is not an .apk file."; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ### Automated Debug Build Details
          - **Artifact:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Target Commit SHA:** ${GITHUB_SHA}
          - **Notice:** This APK is intended for testing purposes only. It is **not** a Google Play Store production release and is signed exclusively with a temporary debug keystore.
          EOF
          )

          EXTRA_ASSET="${{ steps.prep_asset.outputs.minimal_asset }}"

          if [ -n "$EXTRA_ASSET" ] && [ -f "$EXTRA_ASSET" ]; then
            gh release create "$RELEASE_TAG" "$ASSET_PATH" "$EXTRA_ASSET" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release creation succeeded."
            gh release view "$RELEASE_TAG"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Published Successfully

          - **Release Tag:** "${RELEASE_TAG}"
          - **APK Asset Name:** "${ASSET_NAME}"
          - **Release Page:** [View Release](${RELEASE_URL})

          📱 **Direct Download:** Download \`${ASSET_NAME}\` directly from the **Assets** section of the [GitHub Release Page](${RELEASE_URL}) onto your phone.

          📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available in this workflow run.
          EOF

          else
            echo "::warning::Publishing to GitHub Releases failed or encountered an error."
            echo "APK build and artifact preservation succeeded."
            echo "The GitHub Actions artifact named 'app-debug-apk' remains accessible."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Release Publishing Notice

          - **Build Status:** ✅ APK successfully built and verified.
          - **GitHub Actions Artifact:** \`app-debug-apk\` is uploaded and available for download in this workflow run.
          - **GitHub Release Status:** ⚠️ Release publishing failed or was skipped.

          You can download the APK from the **Artifacts** section of this GitHub Actions run.
          EOF
          fi